experiment:
  name: event_native_memory_pedro_p2_centerness_lite96_crop224
  output_dir: runs/event_native_memory_pedro_p2_centerness_lite96_crop224
  seed: 48

dataset:
  name: pedro_event_native
  root: /media/birb/grvc/PEDRo_original
  extra_train_roots:
    - root: /media/birb/grvc/PEDRo_original/NO_PERSPNS/PEDRo_original/with_no_persons
      split: train
      include_empty_frames: true
    - root: /media/birb/grvc/PEDRo_original/live_annotated_dataset_person_only
      split: train
      include_empty_frames: false
  extra_valid_roots:
    - root: /media/birb/grvc/PEDRo_original/valid_set_no_person
      split: val
      include_empty_frames: true
  train_split: train
  valid_split: valid
  test_split: test
  dts_ms: [10, 20, 40]
  anchor_dt_ms: 40
  image_size: 224
  sensor_height: 260
  sensor_width: 346
  num_time_bins: 4
  use_recency_channel: true
  use_count_channel: true
  resize_mode: square
  require_complete_group: true
  include_empty_frames: false

model:
  name: event_fpn_p2_convgru_centerness_det_lite96_small_object_crop224_memory
  in_channels: 15
  stem_channels: 32
  stage_channels: [64, 128, 192]
  fpn_channels: 96
  gru_hidden_channels: 96
  num_classes: 1
  num_feature_levels: 4
  use_centerness: true
  dropout: 0.1

train:
  device: cuda
  batch_size: 1
  num_workers: 0
  pin_memory: true
  epochs: 500
  lr: 2.0e-5
  weight_decay: 1.0e-4
  amp: true
  grad_clip_norm: 0.1
  scheduler: cosine
  warmup_steps: 300
  optimizer_groups: unified
  freeze_batchnorm: true
  shuffle_sequences: true
  init_checkpoint:
  init_checkpoint_strict: true
  init_checkpoint_remap_p2: false
  log_every: 20

memory:
  enabled: true
  prior_channels: 4
  prior_mode: full
  teacher_forcing_epochs: 5
  scheduled_sampling_epochs: 15
  teacher_box_jitter_std_frac: 0.01
  teacher_box_drop_prob: 0.03
  teacher_false_box_prob: 0.01
  prediction_update_score_threshold: 0.25
  prediction_support_gate_strength: 0.25
  dropout_prob: 0.05
  belief_decay_per_second: 0.25
  uncertainty_growth_per_second: 0.35
  age_growth_per_second: 0.50
  belief_mix: 0.80
  detection_uncertainty_reduction: 0.85
  silence_uncertainty_growth: 0.20
  support_source: count_channel
  event_count_reference: 4.0
  support_pool_kernel: 5
  stale_age_threshold: 0.85
  stale_uncertainty_threshold: 0.85
  stale_suppression: 0.15
  min_detection_score: 0.05
  active_belief_epsilon: 1.0e-4

small_object_sampling:
  enabled: false
  no_person_fraction: 0.20
  small_person_fraction: 0.40
  small_area_threshold: 1024.0
  small_height_threshold: 45.0

train_augmentation:
  enabled: false
  horizontal_flip_prob: 0.5
  shift_prob: 0.5
  max_shift_frac: 0.06
  active_crop_prob: 0.35
  active_crop_context_range: [2.2, 2.8]
  active_crop_min_size_frac: 0.40
  active_crop_max_size_frac: 0.85
  active_crop_jitter_frac: 0.15
  active_crop_min_box_height: 8
  active_crop_min_box_area: 40
  negative_crop_min_size_frac: 0.35
  negative_crop_max_size_frac: 0.70
  zoom_out_prob: 0.20
  zoom_out_scale_range: [0.65, 0.85]
  zoom_out_min_box_height: 10
  zoom_out_min_box_area: 60
  event_dropout_prob: 0.5
  event_dropout_frac: [0.05, 0.15]
  event_noise_prob: 0.3
  event_noise_density: [0.001, 0.003]
  event_noise_max_value: 0.25
  channel_gain_jitter_prob: 0.5
  channel_gain_range: [0.85, 1.15]

loss:
  cls_weight: 1.0
  box_weight: 5.0
  giou_weight: 2.0
  centerness_weight: 1.0
  focal_alpha: 0.25
  focal_gamma: 2.0
  min_positive_radius: 1
  max_positive_radius: 1
  small_object:
    enabled: true
    area_threshold: 1024.0
    height_threshold: 45.0
    weight: 2.5
    assign_adjacent_level: true
    adjacent_max_sqrt_area: 48.0

inference:
  threshold: 0.25
  nms_iou: 0.5
  topk: 50
  pre_nms_topk: 1000
  target_live_stride_ms: 50
  active_crop:
    enabled: false
    max_crops: 1
    crop_image_size: 224
    threshold: 0.35

eval:
  real_ap_every: 1
  threshold: 0.05
  nms_iou: 0.5
  topk: 100
  pre_nms_topk: 1000
  decode_on_cpu: true
  batch_size: 1
  num_workers: 0
  max_samples: 0
  no_person_thresholds: [0.2, 0.3, 0.4, 0.5]
  f1_thresholds: [0.2, 0.3, 0.4, 0.5]
  f1_iou_threshold: 0.5
  f1_small_area_threshold: 1024.0
  live_checkpoint:
    enabled: true
    filename: checkpoint_best_live.pth
    metric: AP
    fp_metric: no_person_fp_per_frame_thr_0_50
    max_fp: 0.025
